name: CD Main iwvg-devops-goncalves-yetsibel
on:
  push:
    branches:
      - master

concurrency:
  group: lightsail-deploy
  cancel-in-progress: false

jobs:
  cd:
    name: Build & Push GitHub Package & Deploy on Render Docker Image
    runs-on: ubuntu-22.04

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 🏷️ Prepare container image metadata (repository in lowercase, artifact, version...)
        run: |
          echo "REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV          
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      # 1º Crear Token de Acceso Personal:
      #    GitHub → Settings → Developer settings → Personal access tokens → Generate new token (classic)
      #    Permisos mínimos: write:packages, read:packages, delete:packages, repo
      #
      # 2º Crear secret en GitHub:
      #    Repo → Settings → Secrets and variables → Actions → New repository secret
      #    Name: GHCR_PERSONAL_ACCESS_TOKEN, Value: <tu token>
      - name: 📦 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}

      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          secrets: github_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ env.REPOSITORY }}:${{ env.VERSION }}
            ghcr.io/${{ env.REPOSITORY }}:latest


      - name: 🚀 Deploy on AWS Lightsail
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.AWS_LIGHTSAIL_IP_MAIN }}
          username: ${{ secrets.AWS_LIGHTSAIL_USER_MAIN }}
          key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY_MAIN }}
          script: |
            echo ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/${{ env.REPOSITORY }}:latest
            docker rm -f ${{ env.ARTIFACT }} || true
            docker run -d \
              --name ${{ env.ARTIFACT }} \
              --restart always \
              --memory 220m \
              --memory-swap 220m \
              --network devopsNet \
              -p 10000:10000 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
              -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              -e JAVA_TOOL_OPTIONS="-Xmx160m -Xss256k -XX:MaxMetaspaceSize=80m -XX:+UseSerialGC" \
              --health-cmd="wget -qO- http://localhost:10000/actuator/health || exit 1" \
              --health-interval=10s \
              --health-timeout=5s \
              --health-retries=5 \
              --health-start-period=40s \
              ghcr.io/${{ env.REPOSITORY }}:latest

            echo "⏳ Esperando a que se levante"
            for i in $(seq 1 12); do
              sleep 15
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' ${{ env.ARTIFACT }} 2>/dev/null)
              echo "Intento $i: $STATUS"
              [ "$STATUS" = "healthy" ] && break
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "❌ Deploy fallido"
              echo "--- Estado del contenedor ---"
              docker inspect --format='{{json .State}}' ${{ env.ARTIFACT }}

              echo "--- Código de salida ---"
              docker inspect --format='Exit code: {{.State.ExitCode}} | OOMKilled: {{.State.OOMKilled}}' ${{ env.ARTIFACT }}

              echo "--- Historial de intentos del healthcheck ---"
              docker inspect --format='{{range .State.Health.Log}}{{.Start}} | exit={{.ExitCode}} | {{.Output}}{{"\n"}}{{end}}' ${{ env.ARTIFACT }}

              echo "--- Memoria disponible en el host ---"
              free -h

              echo "--- ¿Hubo OOM-killer? ---"
              dmesg | grep -i "out of memory" | tail -5 || echo "sin coincidencias"

              echo "--- Logs de la app (últimas 80 líneas) ---"
              docker logs --tail 80 ${{ env.ARTIFACT }}
              exit 1
            fi

            echo "✅ Deploy exitoso"
            docker image prune --filter "until=12h" -f