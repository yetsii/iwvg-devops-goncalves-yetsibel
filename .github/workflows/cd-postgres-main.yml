name: CD PostgreSQL

on:
  push:
    branches:
      - master

concurrency:
  group: lightsail-deploy
  cancel-in-progress: false

jobs:
  cd:
    name: Deploy Docker Postgres on AWS Lightsail
    runs-on: ubuntu-22.04

    steps:
      - name: 🚀 Deploy on AWS Lightsail
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.AWS_LIGHTSAIL_IP_MAIN }}
          username: ${{ secrets.AWS_LIGHTSAIL_USER_MAIN }}
          key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY_MAIN }}
          command_timeout: 4m
          script: |
            docker rm -f postgres || true
            docker network create devopsNet || true
            docker volume create postgres_data || true
            docker run -d \
              --name postgres \
              --restart always \
              --network devopsNet \
              -v postgres_data:/var/lib/postgresql/data \
              -e POSTGRES_USER=${{ secrets.POSTGRES_USER }} \
              -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
              -e POSTGRES_DB=${{ secrets.POSTGRES_DB }} \
              --memory 180m \
              --memory-swap 180m \
              --health-cmd="pg_isready -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }}" \
              --health-interval=5s \
              --health-timeout=5s \
              --health-retries=10 \
              --health-start-period=90s \
              postgres:15.10 -c shared_buffers=32MB -c max_connections=20

            echo "⏳ Esperando a que Postgres esté healthy..."
            for i in $(seq 1 60); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' postgres)
              echo "Intento $i: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ Postgres está healthy"
                exit 0
              fi
              sleep 3
            done

            echo "❌ Postgres no llegó a healthy a tiempo"
            docker inspect --format='{{range .State.Health.Log}}{{.Start}} | exit={{.ExitCode}} | {{.Output}}{{"\n"}}{{end}}' postgres
            docker logs --tail 50 postgres
            exit 1